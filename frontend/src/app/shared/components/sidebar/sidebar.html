<aside class="app-sidebar">
  <nav class="app-sidebar__nav" aria-label="Primary navigation">
    <div class="app-sidebar__section-title">Operations</div>

    <ul class="app-sidebar__list">
      @for (item of navigationItems; track item.route) {
        @if (isVisible(item)) {
          <li class="app-sidebar__item">
            <a
              class="app-sidebar__link"
              [routerLink]="item.route"
              routerLinkActive="app-sidebar__link--active"
              [routerLinkActiveOptions]="{ exact: true }"
            >
              <span class="app-sidebar__icon" aria-hidden="true">
                {{ item.icon }}
              </span>

              <span class="app-sidebar__label">{{ item.label }}</span>
            </a>
          </li>
        }
      }
    </ul>
  </nav>
</aside>
