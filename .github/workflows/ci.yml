name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: PHP Tests
    runs-on: ubuntu-latest
    needs: frontend
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: testing
      REDIS_CLIENT: predis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip, bcmath, pdo_sqlite
          coverage: none

      - name: Create required directories
        run: |
          mkdir -p bootstrap/cache
          mkdir -p database
          mkdir -p storage/logs
          touch database/testing.sqlite
          chmod -R 775 bootstrap/cache storage
          cp .env.testing .env

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check PHP syntax
        run: |
          find app tests -type f -name '*.php' -print0 |
            xargs -0 -n1 php -l

      - name: Run Laravel Pint
        run: vendor/bin/pint --test

      - name: Run PHPUnit
        run: php artisan test

  frontend:
    name: Angular Tests
    runs-on: ubuntu-latest
    needs: terraform

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Angular tests
        run: npm test -- --watch=false

      - name: Build Angular application
        run: npm run build -- --configuration production

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build -f docker/php/Dockerfile .

      - name: Build Nginx image
        run: docker build -f docker/nginx/Dockerfile .

      - name: PHP image smoke test
        run: |
          docker build -f docker/php/Dockerfile -t solar-backend-ci .
          docker run --rm solar-backend-ci php -v
          docker run --rm -e APP_ENV=testing solar-backend-ci php artisan --version

      - name: Nginx image smoke test
        run: |
          docker build -f docker/nginx/Dockerfile -t solar-nginx-ci .
          docker run --rm --add-host=app:127.0.0.1 solar-nginx-ci nginx -t
          docker run --rm solar-nginx-ci sh -c 'test -d /var/www/html/public'
          docker run --rm solar-nginx-ci sh -c 'test ! -L /var/www/html/public/storage'

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config

  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest
    needs: docker

    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    needs:
      - docker
      - terraform
      - frontend
      - test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    environment:
      name: production
      url: https://solar-energy-frontend.onrender.com
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      BACKEND_SERVICE_ID: srv-darnifh7lnhs73e4506g
      FRONTEND_SERVICE_ID: srv-daro75npn0mc73dcb8r0
      COMMIT_ID: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Render credentials
        run: |
          test -n "${RENDER_API_KEY}" || {
            echo "::error::RENDER_API_KEY GitHub secret is not configured."
            exit 1
          }

      - name: Deploy backend and wait for result
        run: |
          set -euo pipefail
          response="$(
            curl --fail --silent --show-error \
              --request POST \
              --url "https://api.render.com/v1/services/${BACKEND_SERVICE_ID}/deploys" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --data "{\"commitId\":\"${COMMIT_ID}\",\"clearCache\":\"do_not_clear\",\"deployMode\":\"build_and_deploy\"}"
          )"
          deploy_id="$(printf '%s' "${response}" | jq -r '.id // empty')"
          test -n "${deploy_id}" || {
            echo "::error::Render did not return a backend deploy ID."
            printf '%s\n' "${response}"
            exit 1
          }
          echo "Backend Render deploy: ${deploy_id}"
          for attempt in {1..60}; do
            status="$(
              curl --fail --silent --show-error \
                --url "https://api.render.com/v1/services/${BACKEND_SERVICE_ID}/deploys/${deploy_id}" \
                --header "Accept: application/json" \
                --header "Authorization: Bearer ${RENDER_API_KEY}" |
                jq -r '.status'
            )"
            echo "Backend deployment status: ${status}"
            case "${status}" in
              live)
                echo "Backend deployment successful."
                break
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled)
                echo "::error::Backend Render deployment failed with status: ${status}"
                exit 1
                ;;
            esac
            if [ "${attempt}" -eq 60 ]; then
              echo "::error::Backend Render deployment timed out."
              exit 1
            fi
            sleep 30
          done

      - name: Deploy frontend and wait for result
        run: |
          set -euo pipefail
          response="$(
            curl --fail --silent --show-error \
              --request POST \
              --url "https://api.render.com/v1/services/${FRONTEND_SERVICE_ID}/deploys" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --data "{\"commitId\":\"${COMMIT_ID}\",\"clearCache\":\"do_not_clear\",\"deployMode\":\"build_and_deploy\"}"
          )"
          deploy_id="$(printf '%s' "${response}" | jq -r '.id // empty')"
          test -n "${deploy_id}" || {
            echo "::error::Render did not return a frontend deploy ID."
            printf '%s\n' "${response}"
            exit 1
          }
          echo "Frontend Render deploy: ${deploy_id}"
          for attempt in {1..60}; do
            status="$(
              curl --fail --silent --show-error \
                --url "https://api.render.com/v1/services/${FRONTEND_SERVICE_ID}/deploys/${deploy_id}" \
                --header "Accept: application/json" \
                --header "Authorization: Bearer ${RENDER_API_KEY}" |
                jq -r '.status'
            )"
            echo "Frontend deployment status: ${status}"
            case "${status}" in
              live)
                echo "Frontend deployment successful."
                break
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled)
                echo "::error::Frontend Render deployment failed with status: ${status}"
                exit 1
                ;;
            esac
            if [ "${attempt}" -eq 60 ]; then
              echo "::error::Frontend Render deployment timed out."
              exit 1
            fi
            sleep 30
          done

      - name: Deployment summary
        run: |
          echo "========================================"
          echo "CI/CD DEPLOYMENT SUCCESSFUL"
          echo "========================================"
          echo "Commit: ${COMMIT_ID}"
          echo "Backend: LIVE"
          echo "Frontend: LIVE"
          echo "========================================"
