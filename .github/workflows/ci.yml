name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: PHP Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: testing
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip, bcmath, pdo_sqlite
          coverage: none

      - name: Create required directories
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/logs
          chmod -R 775 bootstrap/cache storage

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check PHP syntax
        run: |
          find app tests -type f -name '*.php' -print0 |
            xargs -0 -n1 php -l

      - name: Run Laravel Pint
        run: vendor/bin/pint --test

      - name: Run PHPUnit
        run: php artisan test

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build -f docker/php/Dockerfile .

      - name: Build Nginx image
        run: docker build -f docker/nginx/Dockerfile .

      - name: PHP image smoke test
        run: |
          docker build -f docker/php/Dockerfile -t solar-backend-ci .
          docker run --rm solar-backend-ci php -v
          docker run --rm solar-backend-ci php artisan --version

      - name: Nginx image smoke test
        run: |
          docker build -f docker/nginx/Dockerfile -t solar-nginx-ci .
          docker run --rm solar-nginx-ci nginx -t
          docker run --rm solar-nginx-ci sh -c 'test -d /var/www/html/public'
          docker run --rm solar-nginx-ci sh -c 'test ! -L /var/www/html/public/storage'

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config

  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate