name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deployment:
    name: Deployment Placeholder
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deployment metadata
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Commit SHA: $GITHUB_SHA"
          echo "Backend image tag: $GITHUB_SHA"
          echo "Nginx image tag: $GITHUB_SHA"

      - name: Build backend image
        run: |
          echo "AWS deployment disabled."
          echo "Would build: backend:<git-sha>"

      - name: Build Nginx image
        run: |
          echo "AWS deployment disabled."
          echo "Would build: nginx:<git-sha>"

      - name: Push images to ECR
        run: |
          echo "AWS deployment disabled."
          echo "Would authenticate using GitHub OIDC."
          echo "Would push immutable images to ECR."

      - name: Update ECS service
        run: |
          echo "AWS deployment disabled."
          echo "Would register the ECS task definition."
          echo "Would update the ECS service."

