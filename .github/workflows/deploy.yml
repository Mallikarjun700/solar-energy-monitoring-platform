name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

      action:
        description: "Deployment action"
        required: true
        type: choice
        options:
          - deploy
          - rollback
        default: deploy

      release_sha:
        description: "Existing Git SHA to deploy when rolling back"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  deployment:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release
        env:
          DEPLOYMENT_ACTION: ${{ inputs.action }}
          REQUESTED_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail

          if [ "$DEPLOYMENT_ACTION" = "deploy" ]; then
            IMAGE_TAG="$GITHUB_SHA"
          elif [ "$DEPLOYMENT_ACTION" = "rollback" ]; then
            if [ -z "$REQUESTED_RELEASE_SHA" ]; then
              echo "ERROR: release_sha is required for rollback."
              exit 1
            fi

            IMAGE_TAG="$REQUESTED_RELEASE_SHA"
          else
            echo "ERROR: Unsupported deployment action: $DEPLOYMENT_ACTION"
            exit 1
          fi

          if ! printf '%s' "$IMAGE_TAG" | grep -Eq '^[0-9a-fA-F]{7,64}$'; then
            echo "ERROR: Invalid release SHA: $IMAGE_TAG"
            exit 1
          fi

          echo "Deployment action: $DEPLOYMENT_ACTION"
          echo "Selected release SHA: $IMAGE_TAG"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Display release plan
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PRODUCTION DEPLOYMENT RELEASE PLAN"
          echo "=========================================="
          echo "Environment: ${{ inputs.environment }}"
          echo "Action:      ${{ inputs.action }}"
          echo "Release SHA: $IMAGE_TAG"

          if [ "${{ inputs.action }}" = "deploy" ]; then
            echo "Images:      BUILD + PUSH"
            echo "Migration:   RUN"
          else
            echo "Images:      EXISTING ECR ARTIFACTS"
            echo "Migration:   SKIP"
          fi

          echo "=========================================="

      - name: Validate rollback environment
        if: ${{ inputs.action == 'rollback' }}
        run: |
          set -euo pipefail

          if [ "${{ inputs.environment }}" != "production" ]; then
            echo "ERROR: Rollback is only allowed for production."
            echo "Requested environment: ${{ inputs.environment }}"
            exit 1
          fi

          echo "Rollback environment: production"
          echo "Rollback safety gate: PASSED"

      - name: Verify rollback artifacts
        if: ${{ inputs.action == 'rollback' }}
        env:
          ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          ECR_NGINX_REPOSITORY: ${{ vars.ECR_NGINX_REPOSITORY }}
        run: |
          set -euo pipefail

          echo "========== ROLLBACK ARTIFACT VERIFICATION =========="
          echo "Release SHA: $IMAGE_TAG"

          echo "Checking backend image..."
          aws ecr describe-images             --repository-name "$ECR_BACKEND_REPOSITORY"             --image-ids "imageTag=$IMAGE_TAG"             --region "$AWS_REGION"             >/dev/null

          echo "Backend image exists."

          echo "Checking Nginx image..."
          aws ecr describe-images             --repository-name "$ECR_NGINX_REPOSITORY"             --image-ids "imageTag=$IMAGE_TAG"             --region "$AWS_REGION"             >/dev/null

          echo "Nginx image exists."
          echo "Rollback artifacts: VERIFIED"

      - name: Validate production branch
        if: ${{ inputs.environment == 'production' }}
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Production deployments are only allowed from main."
            echo "Current branch: $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build deployment metadata
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Commit SHA: $GITHUB_SHA"
          echo "Image tag: $IMAGE_TAG"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate deployment configuration
        env:
          AWS_DEPLOYMENT_ROLE_ARN: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          ECR_NGINX_REPOSITORY: ${{ vars.ECR_NGINX_REPOSITORY }}
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_BACKEND_TASK_FAMILY: ${{ vars.ECS_BACKEND_TASK_FAMILY }}
          ECS_BACKEND_SERVICE_NAME: ${{ vars.ECS_BACKEND_SERVICE_NAME }}
          ECS_QUEUE_TASK_FAMILY: ${{ vars.ECS_QUEUE_TASK_FAMILY }}
          ECS_QUEUE_SERVICE_NAME: ${{ vars.ECS_QUEUE_SERVICE_NAME }}
          ECS_SCHEDULER_TASK_FAMILY: ${{ vars.ECS_SCHEDULER_TASK_FAMILY }}
          ECS_SCHEDULER_SERVICE_NAME: ${{ vars.ECS_SCHEDULER_SERVICE_NAME }}
          ECS_MIGRATION_TASK_FAMILY: ${{ vars.ECS_MIGRATION_TASK_FAMILY }}
          ALB_BACKEND_TARGET_GROUP_ARN: ${{ vars.ALB_BACKEND_TARGET_GROUP_ARN }}
          ALB_DNS_NAME: ${{ vars.ALB_DNS_NAME }}
        run: |
          set -euo pipefail

          required_vars=(
            AWS_DEPLOYMENT_ROLE_ARN
            ECR_BACKEND_REPOSITORY
            ECR_NGINX_REPOSITORY
            ECS_CLUSTER_NAME
            ECS_BACKEND_TASK_FAMILY
            ECS_BACKEND_SERVICE_NAME
            ECS_QUEUE_TASK_FAMILY
            ECS_QUEUE_SERVICE_NAME
            ECS_SCHEDULER_TASK_FAMILY
            ECS_SCHEDULER_SERVICE_NAME
            ECS_MIGRATION_TASK_FAMILY
            ALB_BACKEND_TARGET_GROUP_ARN
            ALB_DNS_NAME
          )

          for variable in "${required_vars[@]}"; do
            if [ -z "${!variable:-}" ]; then
              echo "ERROR: Required deployment variable is empty: $variable"
              exit 1
            fi
          done

          echo "Deployment configuration variables: OK"

          echo ""
          echo "========== AWS IDENTITY =========="
          aws sts get-caller-identity

          echo ""
          echo "========== ECR REPOSITORIES =========="
          aws ecr describe-repositories             --repository-names               "$ECR_BACKEND_REPOSITORY"               "$ECR_NGINX_REPOSITORY"             --region "$AWS_REGION"             >/dev/null

          echo "ECR repositories: OK"

          echo ""
          echo "========== ECS CLUSTER =========="
          cluster_status=$(aws ecs describe-clusters             --clusters "$ECS_CLUSTER_NAME"             --region "$AWS_REGION"             --query 'clusters[0].status'             --output text)

          if [ "$cluster_status" != "ACTIVE" ]; then
            echo "ERROR: ECS cluster is missing or not ACTIVE: $ECS_CLUSTER_NAME"
            exit 1
          fi

          echo "ECS cluster: $ECS_CLUSTER_NAME ($cluster_status)"

          echo ""
          echo "========== ECS SERVICES =========="
          service_count=$(aws ecs describe-services             --cluster "$ECS_CLUSTER_NAME"             --services               "$ECS_BACKEND_SERVICE_NAME"               "$ECS_QUEUE_SERVICE_NAME"               "$ECS_SCHEDULER_SERVICE_NAME"             --region "$AWS_REGION"             --query 'length(services)'             --output text)

          if [ "$service_count" != "3" ]; then
            echo "ERROR: Expected 3 ECS services, found $service_count"
            exit 1
          fi

          aws ecs describe-services             --cluster "$ECS_CLUSTER_NAME"             --services               "$ECS_BACKEND_SERVICE_NAME"               "$ECS_QUEUE_SERVICE_NAME"               "$ECS_SCHEDULER_SERVICE_NAME"             --region "$AWS_REGION"             --query 'services[].{name:serviceName,status:status}'             --output table

          echo "ECS services: OK"

          echo ""
          echo "========== ECS TASK DEFINITIONS =========="
          aws ecs describe-task-definition             --task-definition "$ECS_BACKEND_TASK_FAMILY"             --region "$AWS_REGION"             --query 'taskDefinition.family'             --output text

          aws ecs describe-task-definition             --task-definition "$ECS_QUEUE_TASK_FAMILY"             --region "$AWS_REGION"             --query 'taskDefinition.family'             --output text

          aws ecs describe-task-definition             --task-definition "$ECS_SCHEDULER_TASK_FAMILY"             --region "$AWS_REGION"             --query 'taskDefinition.family'             --output text

          aws ecs describe-task-definition             --task-definition "$ECS_MIGRATION_TASK_FAMILY"             --region "$AWS_REGION"             --query 'taskDefinition.family'             --output text

          echo ""
          echo "Deployment preflight: PASSED"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        if: ${{ inputs.action == 'deploy' }}
        run: |
          docker build \
            -f backend/docker/php/Dockerfile \
            -t "${{ vars.ECR_BACKEND_REPOSITORY }}:${IMAGE_TAG}" \
            backend

      - name: Build Nginx image
        if: ${{ inputs.action == 'deploy' }}
        run: |
          docker build \
            -f docker/nginx/Dockerfile \
            -t "${{ vars.ECR_NGINX_REPOSITORY }}:${IMAGE_TAG}" \
            backend

      - name: Push backend image
        if: ${{ inputs.action == 'deploy' }}
        run: |
          docker push \
            "${{ vars.ECR_BACKEND_REPOSITORY }}:${IMAGE_TAG}"

      - name: Push Nginx image
        if: ${{ inputs.action == 'deploy' }}
        run: |
          docker push \
            "${{ vars.ECR_NGINX_REPOSITORY }}:${IMAGE_TAG}"

      - name: Run database migrations
        if: ${{ inputs.action == 'deploy' }}
        env:
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_BACKEND_SERVICE_NAME: ${{ vars.ECS_BACKEND_SERVICE_NAME }}
          ECS_MIGRATION_TASK_FAMILY: ${{ vars.ECS_MIGRATION_TASK_FAMILY }}
          ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
        run: |
          set -euo pipefail

          echo "========== DATABASE MIGRATION =========="

          echo "Getting backend network configuration..."
          NETWORK_CONFIGURATION=$(aws ecs describe-services             --cluster "$ECS_CLUSTER_NAME"             --services "$ECS_BACKEND_SERVICE_NAME"             --region "$AWS_REGION"             --query 'services[0].networkConfiguration'             --output json)

          if [ "$NETWORK_CONFIGURATION" = "null" ]; then
            echo "ERROR: Backend ECS network configuration was not found."
            exit 1
          fi

          printf '%s' "$NETWORK_CONFIGURATION" > migration-network-configuration.json

          echo "Preparing migration task definition..."
          aws ecs describe-task-definition             --task-definition "$ECS_MIGRATION_TASK_FAMILY"             --region "$AWS_REGION"             --query 'taskDefinition'             > migration-task-definition.json

          python3 - "$ECR_BACKEND_REPOSITORY" "$IMAGE_TAG" <<'PYTHON'
          import json
          import sys
          from pathlib import Path

          repository = sys.argv[1]
          image_tag = sys.argv[2]

          path = Path("migration-task-definition.json")
          definition = json.loads(path.read_text())

          definition["containerDefinitions"][0]["image"] = (
              f"{repository}:{image_tag}"
          )

          for key in [
              "taskDefinitionArn",
              "revision",
              "status",
              "requiresAttributes",
              "compatibilities",
              "registeredAt",
              "registeredBy"
          ]:
              definition.pop(key, None)

          path.write_text(json.dumps(definition))
          PYTHON

          echo "Registering migration task definition..."
          MIGRATION_TASK_DEFINITION_ARN=$(aws ecs register-task-definition             --cli-input-json file://migration-task-definition.json             --region "$AWS_REGION"             --query 'taskDefinition.taskDefinitionArn'             --output text)

          echo "Migration task definition: $MIGRATION_TASK_DEFINITION_ARN"

          echo "Starting migration task..."
          MIGRATION_TASK_ARN=$(aws ecs run-task             --cluster "$ECS_CLUSTER_NAME"             --launch-type FARGATE             --task-definition "$MIGRATION_TASK_DEFINITION_ARN"             --network-configuration file://migration-network-configuration.json             --region "$AWS_REGION"             --query 'tasks[0].taskArn'             --output text)

          if [ -z "$MIGRATION_TASK_ARN" ] || [ "$MIGRATION_TASK_ARN" = "None" ]; then
            echo "ERROR: ECS migration task failed to start."
            exit 1
          fi

          echo "Migration task started: $MIGRATION_TASK_ARN"

          echo "Waiting for migration task to finish..."
          aws ecs wait tasks-stopped             --cluster "$ECS_CLUSTER_NAME"             --tasks "$MIGRATION_TASK_ARN"             --region "$AWS_REGION"

          EXIT_CODE=$(aws ecs describe-tasks             --cluster "$ECS_CLUSTER_NAME"             --tasks "$MIGRATION_TASK_ARN"             --region "$AWS_REGION"             --query 'tasks[0].containers[0].exitCode'             --output text)

          echo "Migration exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "ERROR: Database migration failed."
            exit 1
          fi

          echo "Database migrations completed successfully."

      - name: Download current backend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_BACKEND_TASK_FAMILY }}" \
            --query taskDefinition \
            > backend-task-definition.json

      - name: Render backend task definition
        id: render-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-definition.json
          container-name: app
          image: ${{ vars.ECR_BACKEND_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Render Nginx task definition
        id: render-nginx
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-backend.outputs.task-definition }}
          container-name: nginx
          image: ${{ vars.ECR_NGINX_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Deploy backend service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-nginx.outputs.task-definition }}
          service: ${{ vars.ECS_BACKEND_SERVICE_NAME }}
          cluster: ${{ vars.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true

      - name: Download current queue worker task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_QUEUE_TASK_FAMILY }}" \
            --query taskDefinition \
            > queue-task-definition.json

      - name: Render queue worker task definition
        id: render-queue
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: queue-task-definition.json
          container-name: queue-worker
          image: ${{ vars.ECR_BACKEND_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Deploy queue worker
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-queue.outputs.task-definition }}
          service: ${{ vars.ECS_QUEUE_SERVICE_NAME }}
          cluster: ${{ vars.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true

      - name: Download current scheduler task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_SCHEDULER_TASK_FAMILY }}" \
            --query taskDefinition \
            > scheduler-task-definition.json

      - name: Render scheduler task definition
        id: render-scheduler
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: scheduler-task-definition.json
          container-name: scheduler
          image: ${{ vars.ECR_BACKEND_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Deploy scheduler
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-scheduler.outputs.task-definition }}
          service: ${{ vars.ECS_SCHEDULER_SERVICE_NAME }}
          cluster: ${{ vars.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true

      - name: Verify ALB target health
        env:
          ALB_BACKEND_TARGET_GROUP_ARN: ${{ vars.ALB_BACKEND_TARGET_GROUP_ARN }}
        run: |
          set -euo pipefail

          echo "========== ALB TARGET HEALTH =========="

          if [ -z "$ALB_BACKEND_TARGET_GROUP_ARN" ]; then
            echo "ERROR: ALB target group ARN is not configured."
            exit 1
          fi

          echo "Target group: $ALB_BACKEND_TARGET_GROUP_ARN"

          HEALTH_OUTPUT=$(aws elbv2 describe-target-health             --target-group-arn "$ALB_BACKEND_TARGET_GROUP_ARN"             --region "$AWS_REGION"             --query 'TargetHealthDescriptions[].{Target:Target.Id,Port:Target.Port,State:TargetHealth.State,Reason:TargetHealth.Reason}'             --output json)

          echo "Target health:"
          echo "$HEALTH_OUTPUT"

          TARGET_COUNT=$(printf '%s' "$HEALTH_OUTPUT" | python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)
          print(len(data))
          ')

          HEALTHY_COUNT=$(printf '%s' "$HEALTH_OUTPUT" | python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)
          print(sum(1 for target in data if target.get("State") == "healthy"))
          ')

          echo "Registered targets: $TARGET_COUNT"
          echo "Healthy targets:    $HEALTHY_COUNT"

          if [ "$TARGET_COUNT" -lt 1 ]; then
            echo "ERROR: No targets are registered in the ALB target group."
            exit 1
          fi

          if [ "$HEALTHY_COUNT" -lt 1 ]; then
            echo "ERROR: No healthy ALB targets were detected."
            exit 1
          fi

          echo "ALB target health: PASSED"

      - name: Verify application health endpoint
        env:
          ALB_DNS_NAME: ${{ vars.ALB_DNS_NAME }}
        run: |
          set -euo pipefail

          echo "========== APPLICATION HEALTH =========="

          if [ -z "$ALB_DNS_NAME" ]; then
            echo "ERROR: ALB DNS name is not configured."
            exit 1
          fi

          HEALTH_URL="http://${ALB_DNS_NAME}/up"

          echo "Health endpoint: $HEALTH_URL"

          HTTP_STATUS=$(curl             --silent             --show-error             --output /tmp/application-health-response.txt             --write-out '%{http_code}'             --max-time 15             "$HEALTH_URL")

          echo "HTTP status: $HTTP_STATUS"
          echo "Response:"
          cat /tmp/application-health-response.txt

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Application health endpoint did not return HTTP 200."
            exit 1
          fi

          echo "Application health endpoint: PASSED"

      - name: Verify deployed release
        env:
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_BACKEND_SERVICE_NAME: ${{ vars.ECS_BACKEND_SERVICE_NAME }}
          ECS_QUEUE_SERVICE_NAME: ${{ vars.ECS_QUEUE_SERVICE_NAME }}
          ECS_SCHEDULER_SERVICE_NAME: ${{ vars.ECS_SCHEDULER_SERVICE_NAME }}
          ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          ECR_NGINX_REPOSITORY: ${{ vars.ECR_NGINX_REPOSITORY }}
        run: |
          set -euo pipefail

          echo "========== DEPLOYED RELEASE VERIFICATION =========="

          EXPECTED_BACKEND_IMAGE="${ECR_BACKEND_REPOSITORY}:${IMAGE_TAG}"
          EXPECTED_NGINX_IMAGE="${ECR_NGINX_REPOSITORY}:${IMAGE_TAG}"

          echo "Expected backend image: $EXPECTED_BACKEND_IMAGE"
          echo "Expected Nginx image:   $EXPECTED_NGINX_IMAGE"

          verify_service() {
            local service_name="$1"
            local expected_image="$2"
            local container_name="$3"

            echo ""
            echo "Checking service: $service_name"
            echo "Expected container: $container_name"
            echo "Expected image: $expected_image"

            local task_arns
            task_arns=$(aws ecs list-tasks               --cluster "$ECS_CLUSTER_NAME"               --service-name "$service_name"               --desired-status RUNNING               --region "$AWS_REGION"               --query 'taskArns[]'               --output text)

            if [ -z "$task_arns" ] || [ "$task_arns" = "None" ]; then
              echo "ERROR: No running tasks found for $service_name."
              return 1
            fi

            local task_arn
            while read -r task_arn; do
              [ -z "$task_arn" ] && continue

              local actual_image
              actual_image=$(aws ecs describe-tasks                 --cluster "$ECS_CLUSTER_NAME"                 --tasks "$task_arn"                 --region "$AWS_REGION"                 --query "tasks[0].containers[?name=='$container_name'].image | [0]"                 --output text)

              echo "Task: $task_arn"
              echo "Actual image: $actual_image"

              if [ -z "$actual_image" ] || [ "$actual_image" = "None" ]; then
                echo "ERROR: Container $container_name was not found in task $task_arn."
                return 1
              fi

              if [ "$actual_image" != "$expected_image" ]; then
                echo "ERROR: Release mismatch for $service_name."
                echo "Expected: $expected_image"
                echo "Actual:   $actual_image"
                return 1
              fi
            done <<< "$task_arns"

            echo "$service_name release verification: PASSED"
          }

          verify_service             "$ECS_BACKEND_SERVICE_NAME"             "$EXPECTED_BACKEND_IMAGE"             "app"

          verify_service             "$ECS_QUEUE_SERVICE_NAME"             "$EXPECTED_BACKEND_IMAGE"             "queue-worker"

          verify_service             "$ECS_SCHEDULER_SERVICE_NAME"             "$EXPECTED_BACKEND_IMAGE"             "scheduler"

          echo ""
          echo "Checking backend Nginx containers..."

          BACKEND_TASK_ARNS=$(aws ecs list-tasks             --cluster "$ECS_CLUSTER_NAME"             --service-name "$ECS_BACKEND_SERVICE_NAME"             --desired-status RUNNING             --region "$AWS_REGION"             --query 'taskArns[]'             --output text)

          if [ -z "$BACKEND_TASK_ARNS" ] || [ "$BACKEND_TASK_ARNS" = "None" ]; then
            echo "ERROR: No running backend tasks found for Nginx verification."
            exit 1
          fi

          while read -r task_arn; do
            [ -z "$task_arn" ] && continue

            ACTUAL_NGINX_IMAGE=$(aws ecs describe-tasks               --cluster "$ECS_CLUSTER_NAME"               --tasks "$task_arn"               --region "$AWS_REGION"               --query "tasks[0].containers[?name=='nginx'].image | [0]"               --output text)

            echo "Task: $task_arn"
            echo "Actual Nginx image: $ACTUAL_NGINX_IMAGE"

            if [ "$ACTUAL_NGINX_IMAGE" != "$EXPECTED_NGINX_IMAGE" ]; then
              echo "ERROR: Nginx release mismatch."
              echo "Expected: $EXPECTED_NGINX_IMAGE"
              echo "Actual:   $ACTUAL_NGINX_IMAGE"
              exit 1
            fi
          done <<< "$BACKEND_TASK_ARNS"

          echo "Backend Nginx release verification: PASSED"
          echo ""
          echo "Deployed release verification: PASSED"

      - name: Deployment summary
        run: |
          echo "========================================"
          echo "Deployment completed"
          echo "Environment : ${{ inputs.environment }}"
          echo "Commit SHA  : $GITHUB_SHA"
          echo "Backend     : ${{ vars.ECR_BACKEND_REPOSITORY }}:${IMAGE_TAG}"
          echo "Nginx       : ${{ vars.ECR_NGINX_REPOSITORY }}:${IMAGE_TAG}"
          echo "========================================"