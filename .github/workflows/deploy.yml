name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deployment:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production branch
        if: ${{ inputs.environment == 'production' }}
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Production deployments are only allowed from main."
            echo "Current branch: $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build deployment metadata
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Commit SHA: $GITHUB_SHA"
          echo "Image tag: $IMAGE_TAG"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate deployment configuration
        env:
          AWS_DEPLOYMENT_ROLE_ARN: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          ECR_NGINX_REPOSITORY: ${{ vars.ECR_NGINX_REPOSITORY }}
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_BACKEND_TASK_FAMILY: ${{ vars.ECS_BACKEND_TASK_FAMILY }}
          ECS_BACKEND_SERVICE_NAME: ${{ vars.ECS_BACKEND_SERVICE_NAME }}
          ECS_QUEUE_TASK_FAMILY: ${{ vars.ECS_QUEUE_TASK_FAMILY }}
          ECS_QUEUE_SERVICE_NAME: ${{ vars.ECS_QUEUE_SERVICE_NAME }}
          ECS_SCHEDULER_TASK_FAMILY: ${{ vars.ECS_SCHEDULER_TASK_FAMILY }}
          ECS_SCHEDULER_SERVICE_NAME: ${{ vars.ECS_SCHEDULER_SERVICE_NAME }}
        run: |
          set -euo pipefail

          required_vars=(
            AWS_DEPLOYMENT_ROLE_ARN
            ECR_BACKEND_REPOSITORY
            ECR_NGINX_REPOSITORY
            ECS_CLUSTER_NAME
            ECS_BACKEND_TASK_FAMILY
            ECS_BACKEND_SERVICE_NAME
            ECS_QUEUE_TASK_FAMILY
            ECS_QUEUE_SERVICE_NAME
            ECS_SCHEDULER_TASK_FAMILY
            ECS_SCHEDULER_SERVICE_NAME
          )

          for variable in "${required_vars[@]}"; do
            if [ -z "${!variable:-}" ]; then
              echo "ERROR: Required deployment variable is empty: $variable"
              exit 1
            fi
          done

          echo "Deployment configuration variables: OK"

          echo ""
          echo "========== AWS IDENTITY =========="
          aws sts get-caller-identity

          echo ""
          echo "========== ECR REPOSITORIES =========="
          aws ecr describe-repositories             --repository-names               "$ECR_BACKEND_REPOSITORY"               "$ECR_NGINX_REPOSITORY"             --region "$AWS_REGION"             >/dev/null

          echo "ECR repositories: OK"

          echo ""
          echo "========== ECS CLUSTER =========="
          cluster_status=$(aws ecs describe-clusters             --clusters "$ECS_CLUSTER_NAME"             --region "$AWS_REGION"             --query 'clusters[0].status'             --output text)

          if [ "$cluster_status" != "ACTIVE" ]; then
            echo "ERROR: ECS cluster is missing or not ACTIVE: $ECS_CLUSTER_NAME"
            exit 1
          fi

          echo "ECS cluster: $ECS_CLUSTER_NAME ($cluster_status)"

          echo ""
          echo "========== ECS SERVICES =========="
          service_count=$(aws ecs describe-services             --cluster "$ECS_CLUSTER_NAME"             --services               "$ECS_BACKEND_SERVICE_NAME"               "$ECS_QUEUE_SERVICE_NAME"               "$ECS_SCHEDULER_SERVICE_NAME"             --region "$AWS_REGION"             --query 'length(services)'             --output text)

          if [ "$service_count" != "3" ]; then
            echo "ERROR: Expected 3 ECS services, found $service_count"
            exit 1
          fi

          aws ecs describe-services             --cluster "$ECS_CLUSTER_NAME"             --services               "$ECS_BACKEND_SERVICE_NAME"               "$ECS_QUEUE_SERVICE_NAME"               "$ECS_SCHEDULER_SERVICE_NAME"             --region "$AWS_REGION"             --query 'services[].{name:serviceName,status:status}'             --output table

          echo "ECS services: OK"

          echo ""
          echo "========== ECS TASK DEFINITIONS =========="
          aws ecs describe-task-definition             --task-definition "$ECS_BACKEND_TASK_FAMILY"             --region "$AWS_REGION"             --query 'taskDefinition.family'             --output text

          aws ecs describe-task-definition             --task-definition "$ECS_QUEUE_TASK_FAMILY"             --region "$AWS_REGION"             --query 'taskDefinition.family'             --output text

          aws ecs describe-task-definition             --task-definition "$ECS_SCHEDULER_TASK_FAMILY"             --region "$AWS_REGION"             --query 'taskDefinition.family'             --output text

          echo ""
          echo "Deployment preflight: PASSED"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        run: |
          docker build \
            -f backend/docker/php/Dockerfile \
            -t "${{ vars.ECR_BACKEND_REPOSITORY }}:${IMAGE_TAG}" \
            backend

      - name: Build Nginx image
        run: |
          docker build \
            -f docker/nginx/Dockerfile \
            -t "${{ vars.ECR_NGINX_REPOSITORY }}:${IMAGE_TAG}" \
            backend

      - name: Push backend image
        run: |
          docker push \
            "${{ vars.ECR_BACKEND_REPOSITORY }}:${IMAGE_TAG}"

      - name: Push Nginx image
        run: |
          docker push \
            "${{ vars.ECR_NGINX_REPOSITORY }}:${IMAGE_TAG}"

      - name: Download current backend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_BACKEND_TASK_FAMILY }}" \
            --query taskDefinition \
            > backend-task-definition.json

      - name: Render backend task definition
        id: render-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-definition.json
          container-name: app
          image: ${{ vars.ECR_BACKEND_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Render Nginx task definition
        id: render-nginx
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-backend.outputs.task-definition }}
          container-name: nginx
          image: ${{ vars.ECR_NGINX_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Deploy backend service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-nginx.outputs.task-definition }}
          service: ${{ vars.ECS_BACKEND_SERVICE_NAME }}
          cluster: ${{ vars.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true

      - name: Download current queue worker task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_QUEUE_TASK_FAMILY }}" \
            --query taskDefinition \
            > queue-task-definition.json

      - name: Render queue worker task definition
        id: render-queue
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: queue-task-definition.json
          container-name: queue-worker
          image: ${{ vars.ECR_BACKEND_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Deploy queue worker
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-queue.outputs.task-definition }}
          service: ${{ vars.ECS_QUEUE_SERVICE_NAME }}
          cluster: ${{ vars.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true

      - name: Download current scheduler task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_SCHEDULER_TASK_FAMILY }}" \
            --query taskDefinition \
            > scheduler-task-definition.json

      - name: Render scheduler task definition
        id: render-scheduler
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: scheduler-task-definition.json
          container-name: scheduler
          image: ${{ vars.ECR_BACKEND_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Deploy scheduler
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-scheduler.outputs.task-definition }}
          service: ${{ vars.ECS_SCHEDULER_SERVICE_NAME }}
          cluster: ${{ vars.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true

      - name: Deployment summary
        run: |
          echo "========================================"
          echo "Deployment completed"
          echo "Environment : ${{ inputs.environment }}"
          echo "Commit SHA  : $GITHUB_SHA"
          echo "Backend     : ${{ vars.ECR_BACKEND_REPOSITORY }}:${IMAGE_TAG}"
          echo "Nginx       : ${{ vars.ECR_NGINX_REPOSITORY }}:${IMAGE_TAG}"
          echo "========================================"