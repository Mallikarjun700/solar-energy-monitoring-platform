x-app-env: &app-env
  APP_ENV: local
  APP_DEBUG: "true"
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: solar_energy
  DB_USERNAME: solar
  DB_PASSWORD: solar_password
  TELEMETRY_DB_HOST: postgres
  TELEMETRY_DB_PORT: 5432
  TELEMETRY_DB_DATABASE: telemetry
  TELEMETRY_DB_USERNAME: telemetry
  TELEMETRY_DB_PASSWORD: telemetry_password
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PORT: 6379

x-app-build: &app-build
  build:
    context: .
    dockerfile: docker/php/Dockerfile

x-app-volumes: &app-volumes
  - .:/var/www/html

x-app-depends: &app-depends
  mysql:
    condition: service_healthy
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  app:
    <<: *app-build
    container_name: solar-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes: *app-volumes
    environment:
      <<: *app-env
      QUEUE_CONNECTION: database
      CACHE_STORE: redis
      SERVICE_TYPE: app
    entrypoint: sh ./docker/entrypoint.sh
    depends_on:
      <<: *app-depends
      init-db:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    container_name: solar-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  frontend:
    build:
      context: ../frontend
      dockerfile: docker/Dockerfile
    container_name: solar-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      nginx:
        condition: service_started

  mysql:
    image: mysql:8.0
    container_name: solar-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: solar_energy
      MYSQL_USER: solar
      MYSQL_PASSWORD: solar_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: solar-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: "0"
    ports:
      - "8081:80"

  postgres:
    image: postgres:16
    container_name: solar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: solar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  init-db:
    <<: *app-build
    container_name: solar-init-db
    working_dir: /var/www/html
    volumes: *app-volumes
    environment:
      <<: *app-env
      SERVICE_TYPE: init-db
    entrypoint: sh ./docker/entrypoint.sh
    depends_on: *app-depends

  queue-worker:
    <<: *app-build
    container_name: solar-queue-worker
    restart: unless-stopped
    working_dir: /var/www/html
    volumes: *app-volumes
    environment:
      <<: *app-env
      QUEUE_CONNECTION: database
      CACHE_STORE: redis
      SERVICE_TYPE: queue-worker
    entrypoint: sh ./docker/entrypoint.sh
    depends_on: *app-depends

  scheduler:
    <<: *app-build
    container_name: solar-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes: *app-volumes
    environment:
      <<: *app-env
      QUEUE_CONNECTION: database
      CACHE_STORE: redis
      SERVICE_TYPE: scheduler
    entrypoint: sh ./docker/entrypoint.sh
    depends_on: *app-depends

volumes:
  mysql_data:
  postgres_data:
  redis_data:
